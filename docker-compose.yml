version: '3.8'

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mining-app-frontend
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_BACKEND_URL=http://localhost:5000
      - REACT_APP_GITHUB_CALLBACK_URL=http://localhost:5000/auth/github/callback
    depends_on:
      - backend
    networks:
      - mining-network
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mining-app-backend
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - GITHUB_CLIENT_ID=${GITHUB_CLIENT_ID}
      - GITHUB_CLIENT_SECRET=${GITHUB_CLIENT_SECRET}
      - GITHUB_CALLBACK_URL=http://localhost:5000/auth/github/callback
      - JWT_SECRET=${JWT_SECRET}
      - AI_API_URL=${AI_API_URL}
      - AI_API_KEY=${AI_API_KEY}
      - DATABASE_URL=postgresql://miner_user:miner_password@postgres:5432/miner_db
      - REDIS_URL=redis://redis:6379
    depends_on:
      - postgres
      - redis
    networks:
      - mining-network
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: mining-app-postgres
    environment:
      - POSTGRES_USER=miner_user
      - POSTGRES_PASSWORD=miner_password
      - POSTGRES_DB=miner_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - mining-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U miner_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: mining-app-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - mining-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:

networks:
  mining-network:
    driver: bridge
